openapi: 3.0.3
info:
  title: Towera API
  version: 1.0.0
  description: 'Language-agnostic data collection platform: phrases, translations,
    audio, review, export.'
paths:
  /api/audio/:
    get:
      operationId: audio_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: translation
        schema:
          type: integer
      tags:
      - audio
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                    example: 200
                  responseMessage:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/PaginatedAudioRecordingList'
                required:
                - responseCode
                - responseMessage
          description: ''
    post:
      operationId: audio_create
      tags:
      - audio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioRecording'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioRecording'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioRecording'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                    example: 200
                  responseMessage:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/AudioRecording'
                required:
                - responseCode
                - responseMessage
          description: ''
