  /api/export/dataset/:
    get:
      operationId: export_dataset_retrieve
      description: |-
        GET /api/export/dataset/?export_format=json|csv&status=approved&language=&dialect=&category=&include_audio_urls=false

        Note: the query param is `export_format`, not `format` — DRF reserves
        `format` for its own content-negotiation and 404s on unknown values.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by Phrase category.
      - in: query
        name: dialect
        schema:
          type: integer
        description: Filter by Dialect id.
      - in: query
        name: export_format
        schema:
          type: string
        description: '''json'' (default) or ''csv''.'
      - in: query
        name: include_audio_urls
        schema:
          type: boolean
        description: Generate a pre-signed playback URL per row (extra S3 call per
          row with audio).
      - in: query
        name: language
        schema:
          type: integer
        description: Filter by target Language id.
      - in: query
        name: phrase
        schema:
          type: integer
        description: Filter by Phrase id.
      - in: query
        name: status
        schema:
          type: string
        description: '''approved'' (default), ''pending'', ''rejected'', or ''all''.'
      tags:
      - export
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                    example: 200
                  responseMessage:
                    type: string
                    example: OK
