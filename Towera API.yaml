components:
  schemas:
    AdminUser:
      type: object
      description: Used by admins to view/manage any user, including role changes.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          enum:
          - admin
          - contributor
          - reviewer
          type: string
          description: |-
            * `admin` - Admin
            * `contributor` - Contributor
            * `reviewer` - Reviewer
          x-spec-enum-id: 503259a13f13bb65
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - date_joined
      - id
      - username
    AudioPresignRequest:
      type: object
      properties:
        translation:
          type: integer
        filename:
          type: string
        content_type:
          type: string
          default: audio/mpeg
      required:
      - filename
      - translation
    AudioPresignResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        s3_key:
          type: string
        content_type:
          type: string
      required:
      - content_type
      - s3_key
      - upload_url
    AudioRecording:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        translation:
          type: integer
        s3_key:
          type: string
          maxLength: 512
        content_type:
          type: string
          maxLength: 100
        duration_seconds:
          type: number
          format: double
          nullable: true
        uploaded_by:
          type: integer
          readOnly: true
        audio_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audio_url
      - created_at
      - id
      - s3_key
      - translation
      - uploaded_by
    DatasetExportResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRow'
      required:
      - count
      - results
    DatasetRow:
      type: object
      properties:
        phrase_id:
          type: integer
        source_language:
          type: string
        source_text:
          type: string
        category:
          type: string
        target_language:
          type: string
        dialect:
          type: string
        translation_text:
          type: string
        contributor:
          type: string
        status:
          type: string
        audio_s3_key:
          type: string
        audio_url:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - audio_s3_key
      - audio_url
      - category
      - contributor
      - created_at
      - dialect
      - phrase_id
      - source_language
      - source_text
      - status
      - target_language
      - translation_text
    Dialect:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        language:
          type: integer
        language_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        region:
          type: string
          description: e.g. state/province.
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - language
      - language_name
      - name
    Language:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          nullable: true
          description: ISO 639-1/639-3 code if available, e.g. 'yo', 'ha', 'ibo'.
          maxLength: 10
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        dialects:
          type: array
          items:
            $ref: '#/components/schemas/Dialect'
          readOnly: true
      required:
      - created_at
      - dialects
      - id
      - name
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
